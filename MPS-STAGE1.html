<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mars Presupply — Stage 1</title>
<style>
  :root{
    --ink:#e8ddd2; --dim:#9a8677; --amber:#e8a33d; --rust:#c1662f;
    --go:#4caf7d; --nogo:#d9534f; --edge:#2e241c; --cyan:#5f9ea0;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#0a0705;
    font-family:var(--mono);color:var(--ink)}
  body{overflow:hidden}

  /* ---------------- hub ---------------- */
  #hub{position:fixed;inset:0;overflow:auto;padding:28px 20px 40px;
    background:radial-gradient(120% 90% at 50% -10%,#2a150c 0%,#0a0705 60%)}
  #hub.hidden{display:none}
  .wrap{max-width:900px;margin:0 auto}

  header{text-align:center;margin-bottom:22px}
  h1{font-size:22px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);
    margin:0 0 4px;font-weight:600}
  .tag{font-size:12px;color:var(--dim);letter-spacing:.12em}

  /* campaign strip */
  .camp{background:#14100d;border:1px solid var(--edge);border-radius:12px;
    padding:14px 16px;margin-bottom:20px}
  .campTop{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
  .stats{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--dim)}
  .stats b{color:var(--ink);font-weight:600}
  .campBtns{display:flex;gap:6px;flex-wrap:wrap}
  .campBtns button{font-family:var(--mono);font-size:11px;background:#241c15;color:var(--dim);
    border:1px solid var(--edge);border-radius:7px;padding:9px 12px;cursor:pointer;min-height:38px}
  .campBtns button:hover{border-color:var(--amber);color:var(--amber)}
  .codeRow{margin-top:12px;padding-top:12px;border-top:1px solid var(--edge);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .codeRow .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}
  .codeRow code{flex:1 1 240px;font-size:12px;color:var(--amber);word-break:break-all;
    letter-spacing:.06em;user-select:all;min-width:0}
  #pasteWrap{display:none;margin-top:10px;gap:6px}
  #pasteWrap.on{display:flex;flex-wrap:wrap}
  #pasteIn{flex:1 1 260px;font-family:var(--mono);font-size:12px;background:#0f0b08;
    color:var(--ink);border:1px solid var(--edge);border-radius:7px;padding:11px;min-width:0}

  /* mission grid */
  .secLab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);
    margin:0 0 10px 2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .tile{background:#14100d;border:1px solid var(--edge);border-radius:12px;padding:14px;
    cursor:pointer;transition:border-color .12s,transform .12s;position:relative;
    display:flex;gap:12px;align-items:flex-start}
  .tile:hover{border-color:var(--amber);transform:translateY(-2px)}
  .tile .num{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:#241c15;
    border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--dim)}
  .tile.done .num{background:rgba(76,175,125,.16);border-color:var(--go);color:var(--go)}
  .tile .body{flex:1 1 auto;min-width:0}
  .tile .abbr{font-size:10px;letter-spacing:.14em;color:var(--rust)}
  .tile .name{font-size:15px;color:var(--ink);margin:2px 0 4px;font-weight:600}
  .tile .blurb{font-size:11.5px;color:var(--dim);line-height:1.5}
  .pill{display:inline-block;margin-top:8px;font-size:10px;letter-spacing:.1em;
    padding:3px 8px;border-radius:20px;border:1px solid var(--edge);color:var(--dim)}
  .pill.done{border-color:var(--go);color:var(--go);background:rgba(76,175,125,.1)}
  .pill.next{border-color:var(--amber);color:var(--amber);background:rgba(232,163,61,.1)}

  footer{margin-top:26px;text-align:center;font-size:11px;color:#5f5147;line-height:1.7}

  /* ---------------- player ---------------- */
  #player{position:fixed;inset:0;display:none;flex-direction:column;background:#000;z-index:100}
  #player.on{display:flex}
  #pbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 10px;
    background:#0f0b08;border-bottom:1px solid var(--edge)}
  #pbar button{font-family:var(--mono);font-size:12px;background:#241c15;color:var(--ink);
    border:1px solid var(--edge);border-radius:7px;padding:8px 13px;cursor:pointer;min-height:38px}
  #pbar button:hover{border-color:var(--amber);color:var(--amber)}
  #pTitle{font-size:12px;color:var(--dim);letter-spacing:.1em}
  #frameWrap{flex:1 1 auto;position:relative;min-height:0}
  #gameFrame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:13px;letter-spacing:.1em;background:#0a0705}
  #loading.hidden{display:none}

  @media (max-width:560px){ h1{font-size:17px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div id="hub">
  <div class="wrap">
    <header>
      <h1>Mars Presupply</h1>
      <div class="tag">STAGE 1 &middot; SEVEN MISSIONS &middot; ONE CAMPAIGN</div>
    </header>

    <div class="camp">
      <div class="campTop">
        <div class="stats" id="stats"></div>
        <div class="campBtns">
          <button id="bPaste">PASTE CODE</button>
          <button id="bCopy">COPY CODE</button>
          <button id="bNew">NEW CAMPAIGN</button>
        </div>
      </div>
      <div class="codeRow">
        <span class="lab">Mission Code</span>
        <code id="codeOut">—</code>
      </div>
      <div id="pasteWrap">
        <input id="pasteIn" placeholder="Paste a Mission Code to load that campaign…" spellcheck="false">
        <button id="bLoad" style="font-family:var(--mono);font-size:12px;background:var(--rust);
          color:#160f09;border:1px solid var(--rust);border-radius:7px;padding:11px 16px;
          cursor:pointer;font-weight:600;min-height:40px">LOAD</button>
      </div>
    </div>

    <div class="secLab">Recommended order — but play any mission anytime</div>
    <div class="grid" id="grid"></div>

    <footer>
      Progress carries automatically between missions on this device.<br>
      Copy the Mission Code to move a campaign to another device or headset.
    </footer>
  </div>
</div>

<div id="player">
  <div id="pbar">
    <button id="bBack">&#9664; MISSIONS</button>
    <span id="pTitle"></span>
  </div>
  <div id="frameWrap">
    <iframe id="gameFrame"
      allow="xr-spatial-tracking; fullscreen; autoplay; accelerometer; gyroscope; magnetometer"
      allowfullscreen></iframe>
    <div id="loading">LOADING MISSION…</div>
  </div>
</div>

<script>
/* =====================================================================
   MARS PRESUPPLY — STAGE 1 COLLECTION

   All seven Stage 1 missions in a single file.

   Each game is embedded whole (base64-encoded) and run inside a same-origin
   iframe via srcdoc. That isolation is deliberate: every mission is a complete
   standalone document with its own `CFG`, `M`, `boot()`, `Audio_`, `initScene`
   and so on. Concatenating seven such scripts into one scope would collide on
   nearly every global. Running each in its own frame means every mission
   behaves EXACTLY as it does standalone -- same code, same tested behaviour.

   Because a srcdoc iframe inherits the parent's origin, the games share this
   page's localStorage. That's what makes the campaign carry automatically:
   MarsState.save() in one mission is visible to MarsState.load() in the next,
   with no code changes to any game. The hub reads the same slot to show
   progress, and can overwrite it from a pasted Mission Code.

   WebXR note: the iframe carries allow="xr-spatial-tracking", which is what
   lets ENTER VR work from inside the frame on a Quest.
   ===================================================================== */

/* ============================================================================
   MARS MISSION — CAMPAIGN STATE & MISSION CODE
   Shared module. Paste this whole block inline into MPS-1 / MTR-1 / MEX-1 / MRT-1.
   No dependencies. Safe to include more than once (idempotent).

   PUBLIC API
     MarsState.newCampaign(opts)        -> fresh state object
     MarsState.load()                   -> state from localStorage, or null
     MarsState.save(state)              -> true/false
     MarsState.clear()                  -> wipes localStorage slot
     MarsState.encode(state)            -> "ABCDE-FGHJK-..." Mission Code
     MarsState.decode(codeString)       -> {ok:true,state} | {ok:false,error,fixed?}
     MarsState.readUrlCode()            -> state from #code=... in the URL, or null
     MarsState.urlFor(file, state)      -> "MTR-1.html#code=..."
     MarsState.summary(state)           -> array of {label,value} readiness lines
     MarsState.item(id) / MarsState.ITEMS
     MarsState.SCHEMA_VERSION, MarsState.STAGE, MarsState.SUBSYS
   ========================================================================== */

var MarsState = (function () {
  'use strict';

  /* ------------------------------------------------------------------ CFG */
  var CFG = {
    STORAGE_KEY:     'dadsvr_mars_v1',
    FORMAT_VERSION:  1,        // encoding container format
    SCHEMA_VERSION:  1,        // field layout; bump when SCHEMA changes
    GROUP_SIZE:      5,        // dashes every N chars in a Mission Code
    AUTOCORRECT:     true,     // brute-force repair of single-char typos
    MAX_MANIFEST:    31,       // distinct item entries (5-bit count)
    MAX_QTY:         15,       // per-item quantity (4-bit)
    MAX_EVENTS:      31        // damage/event log entries (5-bit count)
  };

  var STAGE  = { PRESUPPLY: 0, TRANSIT: 1, SURFACE: 2, RETURN: 3 };
  var DIFF   = { COMMANDER: 0, FLIGHT_DIRECTOR: 1 };

  // Subsystem damage bitmask (hullDamage field). Never renumber.
  var SUBSYS = {
    HULL:        1 << 0,
    CO2_SCRUB:   1 << 1,
    WATER_LOOP:  1 << 2,
    POWER_BUS:   1 << 3,
    COMMS:       1 << 4,
    THERMAL:     1 << 5,
    AIRLOCK:     1 << 6,
    RCS:         1 << 7,
    MAIN_ENGINE: 1 << 8,
    GNC:         1 << 9,
    HYDROPONICS: 1 << 10,
    ISRU_PLANT:  1 << 11,
    REACTOR_A:   1 << 12,
    REACTOR_B:   1 << 13,
    ROVER:       1 << 14,
    MAV:         1 << 15
  };

  /* -------------------------------------------------------- ITEM CATALOG */
  /* IDs are permanent. Append new items, never renumber or reuse.
     m = unit mass (kg), v = unit volume (m^3), p = cruise standby draw (W) */
  /* IDs are permanent. Append new items, never renumber or reuse.
     m = unit mass (kg), w x d = bay footprint in cells, p = cruise standby draw (W).
     Footprints and masses are solver-verified in the payload manifest mission:
     the full wishlist oversubscribes cells 2:1, mass 1.4:1 and cruise power
     1.16:1, so all three constraints bind. Only id/qty/flags are encoded in a
     Mission Code, so these figures can be retuned without breaking saves. */
  var CELL_V = 1.6 * 1.6 * 5.0;   // m^3 represented by one bay cell
  var ITEMS = [
    // --- mandatory infrastructure (id 0-9), pre-placed in the bays ---
    { id: 0,  key: 'mav',          name: 'MAV (dry)',            m: 18000, w: 3, d: 3, p: 40, cat: 'core', fixed: true },
    { id: 1,  key: 'isru',         name: 'ISRU Plant',           m: 8000,  w: 2, d: 3, p: 55, cat: 'core', fixed: true },
    { id: 2,  key: 'reactor',      name: 'Fission Reactor 10kW', m: 2800,  w: 2, d: 2, p: 30, cat: 'core', fixed: true },
    { id: 3,  key: 'hab',          name: 'Habitat Module',       m: 26000, w: 3, d: 4, p: 65, cat: 'core', fixed: true },
    { id: 4,  key: 'cable',        name: 'Power Cable 500m',     m: 900,   w: 1, d: 2, p: 0,  cat: 'core', fixed: true },
    { id: 5,  key: 'airlock',      name: 'Airlock Assembly',     m: 3200,  w: 2, d: 2, p: 12, cat: 'core', fixed: true },

    // --- consumables (10-19) ---
    { id: 10, key: 'food',         name: 'Food Pallet 200 sols', m: 1450, w: 2, d: 2, p: 0,  cat: 'consumable' },
    { id: 11, key: 'o2tank',       name: 'LOX Tank',             m: 1800, w: 1, d: 2, p: 8,  cat: 'consumable' },
    { id: 12, key: 'water',        name: 'Water Cache',          m: 2400, w: 1, d: 2, p: 6,  cat: 'consumable' },
    { id: 13, key: 'n2buffer',     name: 'N2 Buffer Gas',        m: 1100, w: 1, d: 1, p: 2,  cat: 'consumable' },
    { id: 14, key: 'h2feed',       name: 'H2 Feedstock (cryo)',  m: 3600, w: 2, d: 3, p: 45, cat: 'consumable' },
    { id: 15, key: 'makeupgas',    name: 'Makeup Gas Reserve',   m: 800,  w: 1, d: 1, p: 2,  cat: 'consumable' },

    // --- spares (20-29) ---
    { id: 20, key: 'sp_compress',  name: 'Compressor Spare',     m: 900,  w: 1, d: 1, p: 0, cat: 'spare' },
    { id: 21, key: 'sp_pump',      name: 'Pump/Valve Set',       m: 400,  w: 1, d: 1, p: 0, cat: 'spare' },
    { id: 22, key: 'sp_electro',   name: 'Electrolyzer Stack',   m: 1400, w: 1, d: 2, p: 0, cat: 'spare' },
    { id: 23, key: 'sp_suit',      name: 'EVA Suit Spare',       m: 300,  w: 1, d: 1, p: 0, cat: 'spare' },
    { id: 24, key: 'sp_patch',     name: 'Patch & Seal Kit',     m: 180,  w: 1, d: 1, p: 0, cat: 'spare' },
    { id: 25, key: 'sp_wheel',     name: 'Rover Wheel Set',      m: 700,  w: 1, d: 2, p: 0, cat: 'spare' },
    { id: 26, key: 'sp_scrub',     name: 'CO2 Scrubber Beds',    m: 600,  w: 1, d: 1, p: 0, cat: 'spare' },
    { id: 27, key: 'sp_avionics',  name: 'Avionics Spare',       m: 250,  w: 1, d: 1, p: 0, cat: 'spare' },

    // --- mobility & power (30-39) ---
    { id: 30, key: 'rover_p',      name: 'Pressurized Rover',    m: 6200, w: 3, d: 3, p: 90, cat: 'mobility' },
    { id: 31, key: 'rover_u',      name: 'Unpressurized Rover',  m: 1900, w: 2, d: 2, p: 35, cat: 'mobility' },
    { id: 32, key: 'array',        name: 'Solar Array Wing',     m: 1100, w: 1, d: 3, p: 0,  cat: 'power' },
    { id: 33, key: 'battery',      name: 'Battery Bank',         m: 1600, w: 1, d: 1, p: 4,  cat: 'power' },

    // --- science (40-49) ---
    { id: 40, key: 'drill',        name: 'Core Drill',           m: 900,  w: 2, d: 2, p: 15, cat: 'science' },
    { id: 41, key: 'spectro',      name: 'Spectrometer Suite',   m: 350,  w: 1, d: 2, p: 22, cat: 'science' },
    { id: 42, key: 'samplecase',   name: 'Sample Return Case',   m: 200,  w: 1, d: 1, p: 0,  cat: 'science' },
    { id: 43, key: 'weather',      name: 'Weather Mast',         m: 150,  w: 1, d: 2, p: 9,  cat: 'science' },
    { id: 44, key: 'seismo',       name: 'Seismometer',          m: 200,  w: 1, d: 1, p: 7,  cat: 'science' },
    { id: 45, key: 'botany',       name: 'Botany Lab Kit',       m: 1300, w: 2, d: 3, p: 30, cat: 'science' },
    { id: 46, key: 'cavekit',      name: 'Cave Survey Kit',      m: 250,  w: 1, d: 1, p: 5,  cat: 'science' }
  ];
  for (var vi = 0; vi < ITEMS.length; vi++) ITEMS[vi].v = ITEMS[vi].w * ITEMS[vi].d * CELL_V;

  var ITEM_BY_ID = {}, ITEM_BY_KEY = {};
  for (var ii = 0; ii < ITEMS.length; ii++) {
    ITEM_BY_ID[ITEMS[ii].id] = ITEMS[ii];
    ITEM_BY_KEY[ITEMS[ii].key] = ITEMS[ii];
  }

  /* -------------------------------------------------------------- SCHEMA */
  /* Field types:
       'u'  unsigned int,        b = bits
       'q'  quantised float,     b = bits, min, max
       'ua' array of unsigned,   n = count, b = bits
       'qa' array of quantised,  n = count, b = bits, min, max
       'manifest'                variable-length item list
       'events'                  variable-length event-code list
     ORDER IS THE WIRE FORMAT. Never reorder within a version. */
  var SCHEMA_V1 = [
    { k: 'seed',              t: 'u',  b: 32, g: 'meta'   },
    { k: 'sol',               t: 'u',  b: 16, g: 'meta'   },
    { k: 'transitDays',       t: 'u',  b: 9,  g: 'meta'   },

    { k: 'crewAlive',         t: 'u',  b: 6,  g: 'crew'   },
    { k: 'radDoseMsv',        t: 'q',  b: 16, min: 0,    max: 2000,  g: 'crew' },
    { k: 'morale',            t: 'u',  b: 7,  g: 'crew'   },

    { k: 'o2Kg',              t: 'q',  b: 16, min: 0,    max: 5000,  g: 'consum' },
    { k: 'waterKg',           t: 'q',  b: 16, min: 0,    max: 10000, g: 'consum' },
    { k: 'foodSols',          t: 'u',  b: 12, g: 'consum' },
    { k: 'powerMarginKw',     t: 'q',  b: 10, min: -20,  max: 80,    g: 'consum' },

    { k: 'mavPropellantKg',   t: 'q',  b: 16, min: 0,    max: 30000, g: 'stage1' },
    { k: 'baseSiteLat',       t: 'q',  b: 16, min: -90,  max: 90,    g: 'stage1' },
    { k: 'baseSiteLon',       t: 'q',  b: 16, min: -180, max: 180,   g: 'stage1' },
    { k: 'siteSplitKm',       t: 'q',  b: 10, min: 0,    max: 20,    g: 'stage1' },
    { k: 'habIntegrity',      t: 'u',  b: 7,  g: 'stage1' },
    { k: 'habLeakKpaSol',     t: 'q',  b: 10, min: 0,    max: 5,     g: 'stage1' },
    { k: 'makeupGasKg',       t: 'q',  b: 10, min: 0,    max: 500,   g: 'stage1' },
    { k: 'dispersionKm',      t: 'qa', n: 3, b: 10, min: 0, max: 30, g: 'stage1' },
    { k: 'landerIntegrity',   t: 'ua', n: 3, b: 7,  g: 'stage1' },
    { k: 'reactorStandoffM',  t: 'q',  b: 11, min: 0,    max: 2000,  g: 'stage1' },
    { k: 'reactorHealth',     t: 'u',  b: 7,  g: 'stage1' },
    { k: 'roverWear',         t: 'u',  b: 7,  g: 'stage1' },
    { k: 'arrivalLs',         t: 'q',  b: 9,  min: 0,    max: 360,   g: 'stage1' },
    { k: 'commsLagMin',       t: 'q',  b: 9,  min: 0,    max: 25,    g: 'stage1' },

    { k: 'scienceBanked',     t: 'u',  b: 16, g: 'progress' },
    { k: 'evaHours',          t: 'u',  b: 14, g: 'progress' },
    { k: 'hullDamage',        t: 'u',  b: 16, g: 'progress' },

    { k: 'manifest',          t: 'manifest', g: 'cargo'  },
    { k: 'eventLog',          t: 'events',   g: 'cargo'  }
  ];

  // Historical layouts, keyed by schema version. Decoders pick by version byte.
  var SCHEMA_HISTORY = { 1: SCHEMA_V1 };

  // Migrations run in sequence: MIGRATIONS[n] upgrades a v(n) state to v(n+1).
  var MIGRATIONS = {
    // 1: function (s) { s.newField = 0; return s; }
  };

  /* -------------------------------------------------------- BIT PLUMBING */
  function BitWriter() { this.bytes = []; this.cur = 0; this.n = 0; }
  BitWriter.prototype.write = function (val, bits) {
    val = Math.floor(val);
    for (var i = bits - 1; i >= 0; i--) {
      var bit = Math.floor(val / Math.pow(2, i)) % 2;
      if (bit < 0) bit = 0;
      this.cur = (this.cur * 2) + bit;
      this.n++;
      if (this.n === 8) { this.bytes.push(this.cur); this.cur = 0; this.n = 0; }
    }
  };
  BitWriter.prototype.finish = function () {
    while (this.n !== 0) this.write(0, 1);
    return this.bytes.slice();
  };

  function BitReader(bytes) { this.bytes = bytes; this.pos = 0; }
  BitReader.prototype.read = function (bits) {
    var out = 0;
    for (var i = 0; i < bits; i++) {
      var byteIdx = this.pos >> 3;
      if (byteIdx >= this.bytes.length) throw new Error('code truncated');
      var bit = (this.bytes[byteIdx] >> (7 - (this.pos & 7))) & 1;
      out = out * 2 + bit;
      this.pos++;
    }
    return out;
  };

  function maxFor(bits) { return Math.pow(2, bits) - 1; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function quantise(v, bits, min, max) {
    if (typeof v !== 'number' || !isFinite(v)) v = min;
    return Math.round((clamp(v, min, max) - min) / (max - min) * maxFor(bits));
  }
  function dequantise(raw, bits, min, max) {
    return min + (raw / maxFor(bits)) * (max - min);
  }
  // Half-step quantisation error, for round-trip verification.
  function tolerance(f) {
    if (f.t !== 'q' && f.t !== 'qa') return 0;
    return ((f.max - f.min) / maxFor(f.b)) / 2 + 1e-9;
  }

  /* ------------------------------------------------------------- CRC-32 */
  /* CRC-32 rather than CRC-16 specifically because attemptRepair() brute-forces
     ~5000 candidate codes against this checksum. At 16 bits that search finds a
     false-positive roughly 7% of the time and silently loads a corrupted
     campaign — the worst failure this module could have. 32 bits makes it
     ~1 in 10^5 per repair, at a cost of about four extra characters. */
  var CRC_TABLE = (function () {
    var t = new Array(256), c, n, k;
    for (n = 0; n < 256; n++) {
      c = n;
      for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) {
      c = CRC_TABLE[(c ^ (bytes[i] & 0xFF)) & 0xFF] ^ (c >>> 8);
    }
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /* -------------------------------------------------- CROCKFORD BASE32 */
  /* No I, L, O or U — the four characters people mistype by hand. */
  var ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  var DECODE_MAP = (function () {
    var m = {};
    for (var i = 0; i < ALPHABET.length; i++) m[ALPHABET[i]] = i;
    m['I'] = 1; m['L'] = 1; m['O'] = 0; m['U'] = 0;   // forgiving aliases
    return m;
  })();

  function bytesToBase32(bytes) {
    var out = '', buf = 0, bits = 0;
    for (var i = 0; i < bytes.length; i++) {
      buf = (buf << 8) | (bytes[i] & 0xFF);
      bits += 8;
      while (bits >= 5) { out += ALPHABET[(buf >> (bits - 5)) & 31]; bits -= 5; }
    }
    if (bits > 0) out += ALPHABET[(buf << (5 - bits)) & 31];
    return out;
  }

  function base32ToBytes(str) {
    var buf = 0, bits = 0, out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str[i];
      if (!(c in DECODE_MAP)) throw new Error('bad character "' + c + '"');
      buf = (buf << 5) | DECODE_MAP[c];
      bits += 5;
      if (bits >= 8) { out.push((buf >> (bits - 8)) & 0xFF); bits -= 8; }
    }
    return out;
  }

  function groupCode(s) {
    var out = [];
    for (var i = 0; i < s.length; i += CFG.GROUP_SIZE) out.push(s.substr(i, CFG.GROUP_SIZE));
    return out.join('-');
  }
  function normaliseCode(s) {
    return String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  }

  /* ------------------------------------------------------ DEFAULT STATE */
  function newCampaign(opts) {
    opts = opts || {};
    var s = {
      _schemaVersion: CFG.SCHEMA_VERSION,
      difficulty:     opts.difficulty != null ? opts.difficulty : DIFF.COMMANDER,
      stagesComplete: 0,

      seed:        opts.seed != null ? (opts.seed >>> 0) : (Math.floor(Math.random() * 4294967296) >>> 0),
      sol:         0,
      transitDays: 0,

      crewAlive:   0x3F,     // six crew, all present
      radDoseMsv:  0,
      morale:      100,

      o2Kg:          0,
      waterKg:       0,
      foodSols:      0,
      powerMarginKw: 0,

      mavPropellantKg:  0,
      baseSiteLat:      0,
      baseSiteLon:      0,
      siteSplitKm:      0,
      habIntegrity:     100,
      habLeakKpaSol:    0,
      makeupGasKg:      0,
      dispersionKm:     [0, 0, 0],
      landerIntegrity:  [100, 100, 100],
      reactorStandoffM: 0,
      reactorHealth:    100,
      roverWear:        0,
      arrivalLs:        0,
      commsLagMin:      12,

      scienceBanked: 0,
      evaHours:      0,
      hullDamage:    0,

      manifest: [],    // [{id, qty, damaged, stranded}]
      eventLog: []     // [eventCode 0..255]
    };
    return s;
  }

  /* --------------------------------------------------------- MANIFEST IO */
  function addItem(state, keyOrId, qty) {
    var it = (typeof keyOrId === 'string') ? ITEM_BY_KEY[keyOrId] : ITEM_BY_ID[keyOrId];
    if (!it) return false;
    for (var i = 0; i < state.manifest.length; i++) {
      if (state.manifest[i].id === it.id) {
        state.manifest[i].qty = clamp(state.manifest[i].qty + (qty || 1), 0, CFG.MAX_QTY);
        return true;
      }
    }
    if (state.manifest.length >= CFG.MAX_MANIFEST) return false;
    state.manifest.push({ id: it.id, qty: clamp(qty || 1, 0, CFG.MAX_QTY), damaged: false, stranded: false });
    return true;
  }

  function manifestTotals(state) {
    var t = { mass: 0, volume: 0, power: 0, count: 0 };
    for (var i = 0; i < state.manifest.length; i++) {
      var e = state.manifest[i], it = ITEM_BY_ID[e.id];
      if (!it) continue;
      t.mass += it.m * e.qty; t.volume += it.v * e.qty; t.power += it.p * e.qty; t.count += e.qty;
    }
    return t;
  }

  /* --------------------------------------------------------- ENCODE/DECODE */
  function writeField(w, f, state) {
    var v = state[f.k], i;
    switch (f.t) {
      case 'u':
        w.write(clamp(typeof v === 'number' ? v : 0, 0, maxFor(f.b)), f.b);
        break;
      case 'q':
        w.write(quantise(v, f.b, f.min, f.max), f.b);
        break;
      case 'ua':
        for (i = 0; i < f.n; i++) {
          w.write(clamp((v && typeof v[i] === 'number') ? v[i] : 0, 0, maxFor(f.b)), f.b);
        }
        break;
      case 'qa':
        for (i = 0; i < f.n; i++) {
          w.write(quantise(v && v[i], f.b, f.min, f.max), f.b);
        }
        break;
      case 'manifest':
        var list = (v || []).slice(0, CFG.MAX_MANIFEST);
        w.write(list.length, 5);
        for (i = 0; i < list.length; i++) {
          w.write(clamp(list[i].id, 0, 63), 6);
          w.write(clamp(list[i].qty, 0, CFG.MAX_QTY), 4);
          w.write(list[i].damaged ? 1 : 0, 1);
          w.write(list[i].stranded ? 1 : 0, 1);
        }
        break;
      case 'events':
        var ev = (v || []).slice(0, CFG.MAX_EVENTS);
        w.write(ev.length, 5);
        for (i = 0; i < ev.length; i++) w.write(clamp(ev[i], 0, 255), 8);
        break;
      default:
        throw new Error('unknown field type ' + f.t);
    }
  }

  function readField(r, f, state) {
    var i, arr;
    switch (f.t) {
      case 'u':  state[f.k] = r.read(f.b); break;
      case 'q':  state[f.k] = dequantise(r.read(f.b), f.b, f.min, f.max); break;
      case 'ua':
        arr = [];
        for (i = 0; i < f.n; i++) arr.push(r.read(f.b));
        state[f.k] = arr; break;
      case 'qa':
        arr = [];
        for (i = 0; i < f.n; i++) arr.push(dequantise(r.read(f.b), f.b, f.min, f.max));
        state[f.k] = arr; break;
      case 'manifest':
        var n = r.read(5); arr = [];
        for (i = 0; i < n; i++) {
          arr.push({
            id:       r.read(6),
            qty:      r.read(4),
            damaged:  !!r.read(1),
            stranded: !!r.read(1)
          });
        }
        state[f.k] = arr; break;
      case 'events':
        var m = r.read(5); arr = [];
        for (i = 0; i < m; i++) arr.push(r.read(8));
        state[f.k] = arr; break;
      default:
        throw new Error('unknown field type ' + f.t);
    }
  }

  function encode(state) {
    var w = new BitWriter();
    w.write(CFG.FORMAT_VERSION, 8);
    w.write(CFG.SCHEMA_VERSION, 8);
    w.write(clamp(state.difficulty || 0, 0, 3), 2);
    w.write(clamp(state.stagesComplete || 0, 0, 15), 4);
    w.write(0, 2); // reserved

    var schema = SCHEMA_HISTORY[CFG.SCHEMA_VERSION];
    for (var i = 0; i < schema.length; i++) writeField(w, schema[i], state);

    var body = w.finish();
    var c = crc32(body);
    body.push((c >>> 24) & 0xFF, (c >>> 16) & 0xFF, (c >>> 8) & 0xFF, c & 0xFF);
    return groupCode(bytesToBase32(body));
  }

  function decodeStrict(raw) {
    var bytes = base32ToBytes(raw);
    if (bytes.length < 8) throw new Error('code too short');

    // Base32 pads to a 5-bit boundary, so the tail may carry up to 4 spare bits.
    // Try both plausible byte counts and accept whichever checksums.
    var got = null;
    for (var trim = 0; trim <= 1 && !got; trim++) {
      var end = bytes.length - trim;
      var body = bytes.slice(0, end - 4);
      var want = (((bytes[end - 4] << 24) >>> 0) + (bytes[end - 3] << 16) +
                  (bytes[end - 2] << 8) + bytes[end - 1]) >>> 0;
      if (crc32(body) === want) got = body;
    }
    if (!got) throw new Error('checksum failed');

    var r = new BitReader(got);
    var fmt = r.read(8);
    if (fmt !== CFG.FORMAT_VERSION) throw new Error('unsupported format v' + fmt);
    var sv = r.read(8);
    var schema = SCHEMA_HISTORY[sv];
    if (!schema) throw new Error('unknown schema v' + sv);

    var state = newCampaign({ seed: 0 });
    state._schemaVersion = sv;
    state.difficulty     = r.read(2);
    state.stagesComplete = r.read(4);
    r.read(2); // reserved

    for (var i = 0; i < schema.length; i++) readField(r, schema[i], state);

    // Bring forward to the current schema version.
    while (state._schemaVersion < CFG.SCHEMA_VERSION) {
      var mig = MIGRATIONS[state._schemaVersion];
      if (!mig) throw new Error('no migration path from v' + state._schemaVersion);
      state = mig(state);
      state._schemaVersion++;
    }
    return state;
  }

  /* Cheap checksum-only screen, so repair does not run a full schema walk
     across ~5000 candidates. */
  function checksumOk(raw) {
    var bytes;
    try { bytes = base32ToBytes(raw); } catch (e) { return false; }
    if (bytes.length < 8) return false;
    for (var trim = 0; trim <= 1; trim++) {
      var end = bytes.length - trim;
      if (end < 8) continue;
      var body = bytes.slice(0, end - 4);
      var want = (((bytes[end - 4] << 24) >>> 0) + (bytes[end - 3] << 16) +
                  (bytes[end - 2] << 8) + bytes[end - 1]) >>> 0;
      if (crc32(body) === want) return true;
    }
    return false;
  }

  /* Single-character repair. Codes run ~150 characters and a typo partway
     through a Quest keyboard session should not cost the campaign. Tries every
     substitution, then every adjacent transposition.

     Scans the WHOLE candidate space rather than returning on first hit: if two
     different repairs both checksum, the input is ambiguous and we refuse
     rather than guess. Loading the wrong campaign silently is worse than
     making the player retype. */
  function attemptRepair(raw) {
    var found = [], i, j, cand;

    for (i = 0; i < raw.length; i++) {
      for (j = 0; j < ALPHABET.length; j++) {
        if (ALPHABET[j] === raw[i]) continue;
        cand = raw.substring(0, i) + ALPHABET[j] + raw.substring(i + 1);
        if (checksumOk(cand)) { found.push(cand); if (found.length > 1) return null; }
      }
    }
    for (i = 0; i + 1 < raw.length; i++) {
      if (raw[i] === raw[i + 1]) continue;
      cand = raw.substring(0, i) + raw[i + 1] + raw[i] + raw.substring(i + 2);
      if (checksumOk(cand)) { found.push(cand); if (found.length > 1) return null; }
    }

    if (found.length !== 1) return null;
    try { return { state: decodeStrict(found[0]), fixed: found[0] }; }
    catch (e) { return null; }
  }

  function decode(codeString) {
    var raw = normaliseCode(codeString);
    if (!raw) return { ok: false, error: 'empty code' };
    try {
      return { ok: true, state: decodeStrict(raw) };
    } catch (err) {
      if (CFG.AUTOCORRECT) {
        var rep = attemptRepair(raw);
        if (rep) return { ok: true, state: rep.state, repaired: true, fixed: groupCode(rep.fixed) };
      }
      return { ok: false, error: err.message };
    }
  }

  /* ------------------------------------------------------------- STORAGE */
  function save(state) {
    try {
      state._schemaVersion = CFG.SCHEMA_VERSION;
      localStorage.setItem(CFG.STORAGE_KEY, JSON.stringify(state));
      return true;
    } catch (e) { return false; }
  }
  function load() {
    try {
      var s = localStorage.getItem(CFG.STORAGE_KEY);
      if (!s) return null;
      var st = JSON.parse(s);
      while (st._schemaVersion < CFG.SCHEMA_VERSION && MIGRATIONS[st._schemaVersion]) {
        st = MIGRATIONS[st._schemaVersion](st);
        st._schemaVersion++;
      }
      return st;
    } catch (e) { return null; }
  }
  function clearStorage() {
    try { localStorage.removeItem(CFG.STORAGE_KEY); return true; } catch (e) { return false; }
  }

  /* ------------------------------------------------------------ URL HASH */
  function readUrlCode() {
    try {
      var m = /[#&]code=([0-9A-Za-z\-]+)/.exec(location.hash || '');
      if (!m) return null;
      var res = decode(m[1]);
      return res.ok ? res.state : null;
    } catch (e) { return null; }
  }
  function urlFor(file, state) { return file + '#code=' + encode(state); }

  /* ---------------------------------------------------- READINESS REPORT */
  function crewCount(mask) {
    var n = 0;
    for (var i = 0; i < 6; i++) if (mask & (1 << i)) n++;
    return n;
  }
  function summary(s) {
    var t = manifestTotals(s);
    var damaged = 0, stranded = 0;
    for (var i = 0; i < s.manifest.length; i++) {
      if (s.manifest[i].damaged)  damaged  += s.manifest[i].qty;
      if (s.manifest[i].stranded) stranded += s.manifest[i].qty;
    }
    var fill = Math.round((s.mavPropellantKg / 25000) * 100);
    return [
      { label: 'MAV propellant', value: Math.round(s.mavPropellantKg) + ' kg (' + fill + '%)',
        flag: fill >= 100 ? 'go' : 'nogo' },
      { label: 'Cargo landed',   value: (t.count - stranded) + ' of ' + t.count + ' units, ' + damaged + ' damaged' },
      { label: 'Base site',      value: s.siteSplitKm < 0.5 ? 'Single site'
                                        : 'Split site, ' + s.siteSplitKm.toFixed(1) + ' km' },
      { label: 'Habitat',        value: s.habIntegrity + '%, leak ' + s.habLeakKpaSol.toFixed(2) + ' kPa/sol' },
      { label: 'Consumables',    value: s.foodSols + ' food-sols, ' + Math.round(s.o2Kg) + ' kg O2' },
      { label: 'Crew',           value: crewCount(s.crewAlive) + ' of 6, dose ' + Math.round(s.radDoseMsv) + ' mSv' },
      { label: 'Sols elapsed',   value: String(s.sol) }
    ];
  }

  /* ----------------------------------------------------------- ROUND TRIP */
  /* Verifies encode->decode fidelity within quantisation tolerance.
     Returns {ok, mismatches:[{field, sent, got, tol}]}. */
  function verify(state) {
    var res = decode(encode(state));
    if (!res.ok) return { ok: false, mismatches: [{ field: '<decode>', sent: '-', got: res.error, tol: 0 }] };
    var got = res.state, bad = [], schema = SCHEMA_HISTORY[CFG.SCHEMA_VERSION];

    function cmpNum(name, a, b, tol) {
      if (Math.abs(a - b) > tol) bad.push({ field: name, sent: a, got: b, tol: tol });
    }
    if (state.difficulty !== got.difficulty)         bad.push({ field: 'difficulty', sent: state.difficulty, got: got.difficulty, tol: 0 });
    if (state.stagesComplete !== got.stagesComplete) bad.push({ field: 'stagesComplete', sent: state.stagesComplete, got: got.stagesComplete, tol: 0 });

    for (var i = 0; i < schema.length; i++) {
      var f = schema[i], tol = tolerance(f), a = state[f.k], b = got[f.k], j;
      if (f.t === 'u' || f.t === 'q') {
        cmpNum(f.k, a, b, tol);
      } else if (f.t === 'ua' || f.t === 'qa') {
        for (j = 0; j < f.n; j++) cmpNum(f.k + '[' + j + ']', a[j], b[j], tol);
      } else if (f.t === 'manifest') {
        if (a.length !== b.length) { bad.push({ field: 'manifest.length', sent: a.length, got: b.length, tol: 0 }); continue; }
        for (j = 0; j < a.length; j++) {
          if (a[j].id !== b[j].id || a[j].qty !== b[j].qty ||
              !!a[j].damaged !== !!b[j].damaged || !!a[j].stranded !== !!b[j].stranded) {
            bad.push({ field: 'manifest[' + j + ']', sent: JSON.stringify(a[j]), got: JSON.stringify(b[j]), tol: 0 });
          }
        }
      } else if (f.t === 'events') {
        if (a.length !== b.length) { bad.push({ field: 'eventLog.length', sent: a.length, got: b.length, tol: 0 }); continue; }
        for (j = 0; j < a.length; j++) {
          if (a[j] !== b[j]) bad.push({ field: 'eventLog[' + j + ']', sent: a[j], got: b[j], tol: 0 });
        }
      }
    }
    return { ok: bad.length === 0, mismatches: bad };
  }

  /* ------------------------------------------------------------- EXPORTS */
  return {
    CFG: CFG,
    STAGE: STAGE,
    DIFF: DIFF,
    SUBSYS: SUBSYS,
    ITEMS: ITEMS,
    SCHEMA: SCHEMA_V1,
    SCHEMA_VERSION: CFG.SCHEMA_VERSION,

    newCampaign: newCampaign,
    item: function (k) { return (typeof k === 'string') ? ITEM_BY_KEY[k] : ITEM_BY_ID[k]; },
    addItem: addItem,
    manifestTotals: manifestTotals,

    encode: encode,
    decode: decode,
    verify: verify,
    tolerance: tolerance,

    save: save,
    load: load,
    clear: clearStorage,

    readUrlCode: readUrlCode,
    urlFor: urlFor,

    markStageComplete: function (state, stage) {
      state.stagesComplete |= (1 << stage);
      return state;
    },
    isStageComplete: function (state, stage) {
      return !!(state.stagesComplete & (1 << stage));
    },
    summary: summary,
    crewCount: crewCount
  };
})();

/* ------------------------------------------------------------ progress */
/* Working out which missions have actually been played is trickier than it
   looks, because the missions share state fields:
     - Launch Window AND Entry/Descent both write dispersionKm
     - Entry/Descent AND Habitat both write habIntegrity
     - ISRU AND the Readiness Report both mark the stage complete
     - commsLagMin defaults to 12, so it is never a signal of anything
   So a naive "is this field non-default" check reports missions complete that
   were never opened.

   Two mechanisms, in order of trust:
     1. A ledger the hub keeps itself. When a mission is launched the hub
        snapshots the campaign; on return, if the campaign changed, that mission
        is recorded as played. This is exact and immune to field overlap.
     2. Field markers, used only as a fallback for a campaign imported from a
        pasted Mission Code (where there is no local ledger). Each uses a field
        that ONLY that mission writes, and that starts at a known default. */

var LEDGER_KEY = 'mps.stage1.played';

function ledgerRead() {
  try { return JSON.parse(localStorage.getItem(LEDGER_KEY)) || {}; }
  catch (e) { return {}; }
}
function ledgerMark(key) {
  try { var l = ledgerRead(); l[key] = 1; localStorage.setItem(LEDGER_KEY, JSON.stringify(l)); }
  catch (e) {}
}
function ledgerClear() {
  try { localStorage.removeItem(LEDGER_KEY); } catch (e) {}
}

/* Fallback markers -- each field is written by exactly one mission. */
function fieldMarker(key, s) {
  switch (key) {
    case 'PLM': return s.manifest && s.manifest.length > 0;
    case 'LW':  return s.transitDays > 0;                       // only LW writes this
    case 'EDL': return s.landerIntegrity.some(function (v) { return v !== 100; });
    case 'CON': return s.roverWear > 0 || s.baseSiteLat !== 0 || s.baseSiteLon !== 0;
    case 'ISR': return s.mavPropellantKg > 0;
    case 'HD':  return s.habLeakKpaSol > 0;                     // only HD writes this
    case 'RR':  // ISRU sets the same stage bit, so the bit alone proves nothing.
                // Only call the debrief "run" if the stage is marked AND the
                // rest of the campaign actually happened.
                if (!(s.stagesComplete & (1 << MarsState.STAGE.PRESUPPLY))) return false;
                return ['PLM','LW','EDL','CON','ISR','HD']
                  .every(function (k) { return fieldMarker(k, s); });
  }
  return false;
}

function ledgerHasAny() {
  var l = ledgerRead();
  for (var k in l) if (l.hasOwnProperty(k)) return true;
  return false;
}

function hasRun(key, s) {
  if (!s) return false;
  var led = ledgerRead();
  if (led[key]) return true;
  if (key === 'RR' && ledgerHasAny()) {
    // This campaign is being played on this device, so the ledger knows the
    // truth. Don't fall through to the field heuristic -- ISRU sets the same
    // stage bit, which would show the debrief as done before it was opened.
    return false;
  }
  return fieldMarker(key, s);
}

var campaign = null;

function loadCampaign() {
  campaign = MarsState.load() || MarsState.newCampaign({});
  return campaign;
}

/* ---------------------------------------------------------------- view */
function renderHub() {
  var s = loadCampaign();
  var done = 0;
  MISSIONS.forEach(function (m) { if (hasRun(m.key, s)) done++; });

  // stats strip
  var mav = Math.round(s.mavPropellantKg);
  document.getElementById('stats').innerHTML =
    '<span>SEED <b>' + (s.seed || 0) + '</b></span>' +
    '<span>PROGRESS <b>' + done + ' / ' + MISSIONS.length + '</b></span>' +
    '<span>SOL <b>' + s.sol + '</b></span>' +
    '<span>MAV FUEL <b>' + mav + ' kg</b></span>' +
    '<span>HAB <b>' + s.habIntegrity + '%</b></span>';

  document.getElementById('codeOut').textContent = MarsState.encode(s);

  // tiles: mark the first not-yet-run mission as the suggested next step
  var nextKey = null;
  for (var i = 0; i < MISSIONS.length; i++)
    if (!hasRun(MISSIONS[i].key, s)) { nextKey = MISSIONS[i].key; break; }

  var html = '';
  MISSIONS.forEach(function (m) {
    var ran = hasRun(m.key, s);
    var pill = ran ? '<span class="pill done">COMPLETE</span>'
      : (m.key === nextKey ? '<span class="pill next">UP NEXT</span>'
                           : '<span class="pill">NOT RUN</span>');
    html += '<div class="tile' + (ran ? ' done' : '') + '" data-key="' + m.key + '">' +
      '<div class="num">' + (ran ? '\u2713' : m.n) + '</div>' +
      '<div class="body">' +
        '<div class="abbr">MISSION ' + m.n + ' \u00b7 ' + m.key + '</div>' +
        '<div class="name">' + m.name + '</div>' +
        '<div class="blurb">' + m.blurb + '</div>' +
        pill +
      '</div></div>';
  });
  document.getElementById('grid').innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (t) {
    t.addEventListener('click', function () { playMission(t.getAttribute('data-key')); });
  });
}

/* -------------------------------------------------------------- player */
/* Decode a game's base64 payload to text. The games contain plenty of non-ASCII
   (arrows, degree signs, superscripts), so decode as UTF-8 bytes rather than
   trusting atob's latin-1 output. */
function decodeGame(b64) {
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  if (typeof TextDecoder !== 'undefined') return new TextDecoder('utf-8').decode(bytes);
  // fallback for very old engines
  return decodeURIComponent(escape(bin));
}

var currentKey = null, snapshotBefore = null;
function playMission(key) {
  var m = null;
  MISSIONS.forEach(function (x) { if (x.key === key) m = x; });
  if (!m || !GAMES[key]) return;
  currentKey = key;
  // snapshot so we can tell on return whether this mission actually did anything
  try { snapshotBefore = MarsState.encode(loadCampaign()); } catch (e) { snapshotBefore = null; }

  document.getElementById('pTitle').textContent =
    'MISSION ' + m.n + ' \u2014 ' + m.name.toUpperCase();
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('hub').classList.add('hidden');
  document.getElementById('player').classList.add('on');

  var frame = document.getElementById('gameFrame');
  frame.onload = function () { document.getElementById('loading').classList.add('hidden'); };
  // srcdoc keeps the frame same-origin, so the game shares this page's
  // localStorage and the campaign carries across missions untouched
  frame.srcdoc = decodeGame(GAMES[key]);
}

function backToHub() {
  var frame = document.getElementById('gameFrame');
  frame.srcdoc = '';                    // tear the game down (stops its audio + RAF)
  frame.removeAttribute('srcdoc');
  document.getElementById('player').classList.remove('on');
  document.getElementById('hub').classList.remove('hidden');

  // if the campaign moved while we were in there, that mission counts as played
  if (currentKey) {
    var after = null;
    try { after = MarsState.encode(loadCampaign()); } catch (e) {}
    if (after && snapshotBefore && after !== snapshotBefore) ledgerMark(currentKey);
  }
  currentKey = null; snapshotBefore = null;
  renderHub();                          // pick up whatever the mission just saved
}

/* --------------------------------------------------------------- code */
function copyText(txt, okLabel) {
  var t = document.createElement('textarea');
  t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(t);
  var b = document.getElementById('bCopy');
  if (b) { var old = b.textContent; b.textContent = ok ? okLabel : 'SELECT MANUALLY';
    setTimeout(function () { b.textContent = old; }, 1400); }
}

function loadFromCode() {
  var raw = document.getElementById('pasteIn').value.trim();
  if (!raw) return;
  var res = MarsState.decode(raw);
  if (!res || !res.ok) {
    var inp = document.getElementById('pasteIn');
    inp.style.borderColor = 'var(--nogo)';
    inp.value = '';
    inp.placeholder = 'That code didn\u2019t check out \u2014 try pasting it again';
    setTimeout(function () { inp.style.borderColor = ''; }, 1800);
    return;
  }
  // the pasted campaign is not the one this device's ledger describes, so drop
  // the ledger and let the field markers report on the imported campaign
  ledgerClear();
  MarsState.save(res.state);
  document.getElementById('pasteWrap').classList.remove('on');
  document.getElementById('pasteIn').value = '';
  renderHub();
}

function newCampaign() {
  if (!confirm('Start a new campaign? This clears the current progress on this device.')) return;
  ledgerClear();
  MarsState.save(MarsState.newCampaign({}));
  renderHub();
}

/* --------------------------------------------------------------- boot */
function boot() {
  // a code in the URL seeds the campaign, same convention the games use
  var fromUrl = MarsState.readUrlCode && MarsState.readUrlCode();
  if (fromUrl) MarsState.save(fromUrl);
  else if (!MarsState.load()) MarsState.save(MarsState.newCampaign({}));

  renderHub();

  document.getElementById('bBack').addEventListener('click', backToHub);
  document.getElementById('bCopy').addEventListener('click', function () {
    copyText(MarsState.encode(loadCampaign()), 'COPIED');
  });
  document.getElementById('bPaste').addEventListener('click', function () {
    var w = document.getElementById('pasteWrap');
    w.classList.toggle('on');
    if (w.classList.contains('on')) document.getElementById('pasteIn').focus();
  });
  document.getElementById('bLoad').addEventListener('click', loadFromCode);
  document.getElementById('pasteIn').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') loadFromCode();
  });
  document.getElementById('bNew').addEventListener('click', newCampaign);

  // Esc returns to the mission list
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && currentKey) backToHub();
  });
}

boot();
</script>
